name: Daily training dashboard

on:
  schedule:
    # 02:07 UTC = 04:07 SAST. Off the :00 minute mark on purpose (less GitHub Actions queue contention).
    - cron: "7 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          python scripts/build_dashboard.py

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html training-dashboard-*.html knowledge/training-evolution.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          N=$(python -c "import json,sys; d=json.load(open('data/activities.json')); print(len(d))")
          git commit -m "Daily training update ${DATE} — ${N} activities, $(date -u +%H:%M)Z

Auto-generated by .github/workflows/daily-dashboard.yml"
          git push
